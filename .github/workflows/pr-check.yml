name: PR Check

on:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Auth for transitive @callmetechie/gatecontrol-config-hash via GitHub Packages (.npmrc).
  NODE_AUTH_TOKEN: ${{ secrets.GC_PAT }}

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout pinned core (core.ref)
        shell: bash
        run: bash scripts/fetch-core.sh --link

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax check
        run: npm test

      - name: Audit production dependencies (blocking, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true
