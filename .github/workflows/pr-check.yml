name: PR Check

on:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Auth for transitive @callmetechie/gatecontrol-config-hash via GitHub Packages (.npmrc).
  NODE_AUTH_TOKEN: ${{ secrets.GC_PAT }}

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout pinned core (core.ref)
        shell: bash
        run: bash scripts/fetch-core.sh --link

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax check
        run: npm test

      - name: Audit production dependencies (blocking, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true
