name: Security & Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Auth for transitive @callmetechie/gatecontrol-config-hash via GitHub Packages (.npmrc).
  NODE_AUTH_TOKEN: ${{ secrets.GC_PAT }}

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout pinned core (core.ref)
        shell: bash
        run: bash scripts/fetch-core.sh --link

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies (blocking, high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true

      - name: Check for critical vulnerabilities
        run: |
          RESULT=$(npm audit --json 2>/dev/null | node -e "
            const data=require('fs').readFileSync('/dev/stdin','utf8');
            try {
              const audit=JSON.parse(data);
              const critical=(audit.metadata?.vulnerabilities?.critical||0);
              console.log(critical);
            } catch { console.log('0'); }
          ")
          echo "High/Critical vulnerabilities: $RESULT"
          if [ "$RESULT" -gt 0 ] 2>/dev/null; then
            echo "::error::Found $RESULT high/critical vulnerabilities"
            exit 1
          fi

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install ESLint with security plugin
        run: npm install --no-save eslint@8 eslint-plugin-security@1.7.1

      - name: Create security ESLint config
        run: |
          cat > .eslintrc.security.json << 'ESLINTEOF'
          {
            "plugins": ["security"],
            "extends": ["plugin:security/recommended"],
            "env": { "node": true, "es2022": true },
            "parserOptions": { "ecmaVersion": 2022 },
            "rules": {
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-non-literal-require": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-child-process": "warn"
            }
          }
          ESLINTEOF

      - name: Run ESLint security scan
        run: npx eslint -c .eslintrc.security.json "src/**/*.js" --no-eslintrc --format stylish || true
